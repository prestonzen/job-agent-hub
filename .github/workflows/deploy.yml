name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: build
    # Set the repository variable DEPLOY_ENABLED=true (Settings → Variables) once the secrets below exist.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Deploys the Worker + static assets, and syncs Worker secrets from GitHub secrets.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            CLICKUP_TOKEN
            AGENT_TOKENS
            ZADARMA_KEY
            ZADARMA_SECRET
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          AGENT_TOKENS: ${{ secrets.AGENT_TOKENS }}
          ZADARMA_KEY: ${{ secrets.ZADARMA_KEY }}
          ZADARMA_SECRET: ${{ secrets.ZADARMA_SECRET }}
